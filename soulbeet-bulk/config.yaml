name: Soulbeet Bulk
version: 0.1.25
slug: soulbeet_bulk_v2
description: >-
  Fork of Soulbeet that imports a CSV of songs into a library you choose.
  It searches album versions first, skips live recordings, and queues the
  downloads. Beets databases stay on local storage so imports do not lock
  on a network share.
image: ghcr.io/brunonayrb/soulbeet-bulk
arch:
  - amd64
ports:
  9765/tcp: 9766
map:
  - share:rw
  - data:rw
options:
  download_path: ""
  music_base: ""
  navidrome_url: ""
schema:
  download_path: str
  music_base: str
  navidrome_url: str?
