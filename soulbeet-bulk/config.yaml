name: Soulbeet Bulk Test
version: 0.1.10
slug: soulbeet_bulk
description: Test build of Soulbeet with bulk CSV import
arch:
  - amd64
  - aarch64
ports:
  9765/tcp: 9766
map:
  - share:rw
  - data:rw
options:
  download_path: /share/Media/slskd/downloads
  music_base: /share/Media/Music
  navidrome_url: ""
schema:
  download_path:
    name: Download path
    description: Path where slskd saves downloads
    required: true
  music_base:
    name: Music base path
    description: Base path for music libraries
    required: true
  navidrome_url:
    name: Navidrome URL
    description: Full URL to your Navidrome instance (e.g. http://192.168.1.10:4533). Leave empty to disable Navidrome login.
    required: false
