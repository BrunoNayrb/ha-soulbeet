name: Soulbeet Custom
version: "0.7.1-custom.1"
slug: soulbeet_custom
description: Soulbeet music downloader and library manager
url: https://github.com/terry90/soulbeet
arch:
  - amd64
  - aarch64
init: false
hassio_api: true
webui: http://[HOST]:[PORT:9765]
ports:
  9765/tcp: 9765
ports_description:
  9765/tcp: Soulbeet Web UI
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: addon_config
    read_only: false
options:
  navidrome_url: ""
  download_dir: /share/Media/slskd/downloads
  album_mode: false
  tz: ""
schema:
  navidrome_url: str
  download_dir: str
  album_mode: bool
  tz: str?
