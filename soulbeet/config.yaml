name: Soulbeet
version: "0.7.1"
slug: soulbeet
description: >-
  Automated music downloader and library manager integrating slskd (Soulseek) and beets.
  Configured for local beets databases to avoid CIFS/NFS locking issues.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ports:
  9765/tcp: 9765
map:
  - type: share
    read_only: false
options:
  download_path: "/share/Media/slskd/downloads"
  music_base: "/share/Media/Music"
  navidrome_url: ""
schema:
  download_path: str
  music_base: str
  navidrome_url: str?
url: https://github.com/terry90/soulbeet
